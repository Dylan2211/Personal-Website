<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Container vs Button Layout</title>

    <style>
      /* ===== Base Reset ===== */
      * {
        box-sizing: border-box;
      }

      html {
        font-size: 100%;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      /* ===== Layout Layer ===== */
      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f4;
      }

      /* Container controls layout */
      .container {
        width: 60vw;
        min-width: 400px;
        padding: 2rem;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        gap: 2rem;
        align-items: center; /* layout decision */
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 300;
      }

      /* ===== Button Layout ===== */
      .button-row {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      /* Button is content-driven */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5em;

        font-size: 1rem;
        padding: 0.75em 1.25em;

        border: 2px solid #222;
        background: none;
        cursor: pointer;
      }

      /* Example icon sizing tied to text */
      .icon {
        width: 1.25em;
        height: 1.25em;
        background: #222;
        display: inline-block;
      }

      /* Forced layout-controlled button */
      .btn-full {
        width: 100%;
      }

      /* For demonstration clarity */
      .explanation {
        font-size: 0.9rem;
        text-align: center;
        max-width: 400px;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="container">
        <h1>Container Controls Layout</h1>

        <div class="button-row">
          <button class="btn">
            <span class="icon"></span>
            Intrinsic Button
          </button>

          <button class="btn">
            <span class="icon"></span>
            Longer Button Text
          </button>
        </div>

        <div class="button-row">
          <button class="btn btn-full">
            <span class="icon"></span>
            Full Width Button (Layout Controlled)
          </button>
        </div>

        <div class="explanation">
          Top buttons size themselves based on content.<br />
          Bottom button fills the container because width: 100% is applied.
        </div>
      </div>
    </main>
  </body>
</html>

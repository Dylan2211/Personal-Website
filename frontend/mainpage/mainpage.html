<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Page</title>
    <link
      href="https://fonts.googleapis.com/css?family=Poppins"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/main/main.css" />
    <link rel="stylesheet" href="mainpage.css" />
    <script src="https://unpkg.com/interactjs/dist/interact.min.js"></script>
  </head>
  <body>
    <main>
      <div class="page-layer">
        <div id="about" class="page" data-x="0" data-y="0">
          <div class="topbar">
            <div class="topbar-header">about</div>
            <div class="topbar-close">[x]</div>
          </div>
          <div class="page-content">
            <div id="about-container-uwu">
              <img id="pfp" src="/images/pfp.jpg" />
              <div id="about-text-container-owo">
                <h2>Dylan Wong</h2>
                <p>Aspiring developer, designer, artist</p>
              </div>
            </div>
          </div>
        </div>
        <div id="faq" class="page" data-x="0" data-y="0">
          <div class="topbar">
            <div class="topbar-header">faq</div>
            <div class="topbar-close">[x]</div>
          </div>
          <div class="page-content">
            <h1>faq!</h1>
            <div>Haha</div>
          </div>
        </div>
      </div>
      <div class="container">
        <div class="topbar">
          <div class="topbar-header">home</div>
        </div>
        <div class="content">
          <h1>hi! <span id="bold-header">i'm dylan</span></h1>
          <div class="button-container">
            <button class="btn" data-target="about">
              <img class="icon" src="/images/about.jpg" />
              <span>about</span>
            </button>
            <button class="btn" data-target="links">
              <img class="icon" src="/images/links.jpg" />
              <span>links</span>
            </button>
            <button class="btn" data-target="work">
              <img class="icon" src="/images/about.jpg" />
              <span>work</span>
            </button>
            <button class="btn" data-target="faq">
              <img class="icon" src="/images/faq.jpg" />
              <span>faq</span>
            </button>
            <button class="btn" data-target="contact">
              <img class="icon" src="/images/about.jpg" />
              <span>contact</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
  <script src="mainpage.js"></script>
</html>
